name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Single in-flight deploy. Cancel any stuck previous run rather than queue.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write   # peaceiris/actions-gh-pages needs to push gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Custom domain yuzen.tw (apex) — assets served from root.
          BASE_PATH: /
          SITE: https://yuzen.tw
          PUBLIC_FORMSPREE_ENDPOINT: ${{ secrets.PUBLIC_FORMSPREE_ENDPOINT }}

      # Push dist/ to the gh-pages branch.
      # Requires Settings -> Pages -> Source: "Deploy from a branch" -> gh-pages / (root)
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: ${{ github.event.head_commit.message }}
          # Always force-push a single-commit gh-pages so empty/no-diff
          # builds still trigger GitHub's pages build & deployment.
          force_orphan: true
