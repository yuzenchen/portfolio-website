<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>og image</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=IBM+Plex+Mono:wght@500;600&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --ground: #0d1117;
        --panel: #151b23;
        --rule: #232b36;
        --rule-strong: #3a4a5c;
        --text: #e6edf3;
        --soft: #c3ccd6;
        --muted: #8b96a5;
        --mint: #45d6a8;
        --sans: 'Noto Sans TC', sans-serif;
        --mono: 'IBM Plex Mono', monospace;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--ground);
      }
      body { font-family: var(--sans); color: var(--text); }
      .frame {
        width: 1200px;
        height: 630px;
        padding: 72px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .brand { display: flex; align-items: center; gap: 18px; }
      .brand img { width: 56px; height: 56px; display: block; }
      .brand-name { font-weight: 700; font-size: 26px; line-height: 1.2; color: var(--text); }
      .brand-tag {
        font-family: var(--mono); font-weight: 500; font-size: 18px;
        line-height: 1.3; color: var(--mint); margin-top: 2px;
      }
      .headline {
        margin: 0;
        font-weight: 900;
        font-size: 64px;
        line-height: 1.25;
        letter-spacing: 0.01em;
      }
      .headline span { display: block; }
      .headline .accent { color: var(--mint); }
      .compare-wrap { position: relative; }
      .panel {
        background: var(--panel);
        border: 1px solid var(--rule);
        border-radius: 18px;
        padding: 26px 32px;
        display: grid;
        gap: 18px;
      }
      .row-head {
        display: flex; justify-content: space-between; align-items: baseline;
        margin-bottom: 10px;
      }
      .label { font-size: 20px; font-weight: 700; color: var(--soft); }
      .value { font-family: var(--mono); font-weight: 600; font-size: 28px; line-height: 1; color: var(--soft); }
      .auto .label, .auto .value { color: var(--mint); }
      .bar { height: 12px; border-radius: 999px; }
      .manual .bar { width: 100%; background: var(--rule-strong); }
      .auto .bar { width: calc(100% / 6); background: var(--mint); }
      .caption {
        position: absolute; right: 4px; bottom: -30px;
        font-family: var(--mono); font-weight: 500; font-size: 16px; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="brand">
        <img src="../../public/logo.png" alt="" />
        <div>
          <div class="brand-name">Yuzen Chen</div>
          <div class="brand-tag">流程自動化 × 系統開發</div>
        </div>
      </div>

      <h1 class="headline">
        <span>員工每天重複做的事，</span>
        <span class="accent">交給系統自動完成。</span>
      </h1>

      <div class="compare-wrap">
        <div class="panel">
          <div class="row manual">
            <div class="row-head"><span class="label">人工處理</span><span class="value">2 小時</span></div>
            <div class="bar"></div>
          </div>
          <div class="row auto">
            <div class="row-head"><span class="label">系統自動</span><span class="value">20 分鐘</span></div>
            <div class="bar"></div>
          </div>
        </div>
        <div class="caption">Wama' House 實測 · yuzen.tw</div>
      </div>
    </div>
  </body>
</html>
